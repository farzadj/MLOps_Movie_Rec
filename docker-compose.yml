services:
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movie-mlflow
    working_dir: /app
    command: >
      sh -c "mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root /app/mlartifacts"
    ports:
      - "5000:5000"
    volumes:
      - ./:/app

  airflow:
    image: apache/airflow:2.9.3-python3.10
    container_name: movie-airflow
    working_dir: /app
    command: >
      bash -c "airflow db migrate &&
      airflow users create
      --username admin
      --firstname Admin
      --lastname User
      --role Admin
      --email admin@example.com
      --password admin || true &&
      airflow standalone"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      PYTHONPATH: /app
      MLFLOW_TRACKING_URI: http://host.docker.internal:5000
      MLFLOW_EXPERIMENT_NAME: movie_reco_knn
      _PIP_ADDITIONAL_REQUIREMENTS: >-
        pandas==2.2.2 scikit-learn==1.4.2 mlflow==2.7.0 click requests python-dotenv
    ports:
      - "8080:8080"
    volumes:
      - ./:/app
      - ./dags:/opt/airflow/dags
    depends_on:
      - mlflow

  inference-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movie-inference
    working_dir: /app
    command: python -m src.models.inference_api
    environment:
      MODEL_PATH: /app/models/model.pkl
      USER_MATRIX_PATH: /app/data/processed/user_matrix.csv
      MOVIE_MATRIX_PATH: /app/data/processed/movie_matrix.csv
      MOVIES_PATH: /app/data/raw/movies.csv
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: movie_reco_knn
      MLFLOW_REGISTERED_MODEL_NAME: movie_reco_knn
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    depends_on:
      - mlflow

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movie-streamlit
    working_dir: /app
    command: streamlit run src/visualization/streamlit_app.py --server.address=0.0.0.0 --server.port=8501
    environment:
      STREAMLIT_API_URL: http://inference-api:8000
      STREAMLIT_TMDB_API_KEY: ${STREAMLIT_TMDB_API_KEY}
    ports:
      - "8501:8501"
    volumes:
      - ./:/app
    depends_on:
      - inference-api

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: movie-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - inference-api

  grafana:
    image: grafana/grafana:11.2.0
    container_name: movie-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning/datasources/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
    depends_on:
      - prometheus

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movie-pipeline
    working_dir: /app
    profiles:
      - pipeline
    command: >
      sh -c "dvc pull || echo 'DVC pull skipped (no remote configured or no data pushed yet).' &&
      python src/data/make_dataset.py data/raw data/processed &&
      python src/features/build_features.py &&
      python src/models/train_model.py --output-model-path models/model.pkl --registered-model-name ${MLFLOW_REGISTERED_MODEL_NAME:-movie_reco_knn} &&
      (test -f models/base_model.pkl || cp models/model.pkl models/base_model.pkl) &&
      python src/models/evaluate_model.py
      --model-path models/model.pkl
      --base-model-path models/base_model.pkl"
    environment:
      MLFLOW_TRACKING_URI: http://host.docker.internal:5000
      MLFLOW_EXPERIMENT_NAME: movie_reco_knn
      MLFLOW_REGISTERED_MODEL_NAME: movie_reco_knn
    volumes:
      - ./:/app
    depends_on:
      - mlflow
