stages:
  make_dataset:
    cmd: python src/data/make_dataset.py data/raw data/processed
    deps:
      - src/data/make_dataset.py
      - data/raw/ratings.csv
      - data/raw/movies.csv
    outs:
      - data/processed/ratings.csv
      - data/processed/movies.csv

  build_features:
    cmd: python src/features/build_features.py
    deps:
      - src/features/build_features.py
      - data/processed/ratings.csv
      - data/processed/movies.csv
    outs:
      - data/processed/movie_matrix.csv
      - data/processed/user_matrix.csv

  train_model:
    cmd: >-
      python src/models/train_model.py
      --n-neighbors ${train.n_neighbors}
      --algorithm ${train.algorithm}
      --metric ${train.metric}
      --p ${train.p}
      --leaf-size ${train.leaf_size}
      --n-jobs ${train.n_jobs}
      --movie-matrix-path data/processed/movie_matrix.csv
      --output-model-path models/model.pkl
    deps:
      - src/models/train_model.py
      - data/processed/movie_matrix.csv
    params:
      - train.n_neighbors
      - train.algorithm
      - train.metric
      - train.p
      - train.leaf_size
      - train.n_jobs
    outs:
      - models/model.pkl

  evaluate_model:
    cmd: >-
      python src/models/evaluate_model.py
      --ratings-path data/raw/ratings.csv
      --user-matrix-path data/processed/user_matrix.csv
      --movie-matrix-path data/processed/movie_matrix.csv
      --model-path models/model.pkl
      --base-model-path models/base_model.pkl
      --top-k ${eval.top_k}
      --test-size ${eval.test_size}
      --min-interactions ${eval.min_interactions}
      --relevance-threshold ${eval.relevance_threshold}
      --max-users ${eval.max_users}
      --random-seed ${eval.random_seed}
    deps:
      - src/models/evaluate_model.py
      - data/raw/ratings.csv
      - data/processed/user_matrix.csv
      - data/processed/movie_matrix.csv
      - models/model.pkl
      - models/base_model.pkl
    params:
      - eval.top_k
      - eval.test_size
      - eval.min_interactions
      - eval.relevance_threshold
      - eval.max_users
      - eval.random_seed
